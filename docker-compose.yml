version: '3.8'

services:
  golf-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golf-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Persistent storage: WhatsApp login session, SQLite DB, 18Birdies JSON archives
      - ./data:/app/data
      # Group configuration and player details
      - ./config:/app/config
    # TTY and interactive flags to view QR code during pairing
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
